---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kkbase-watcher-config
data:
  # Neo4j connection settings
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_DATABASE: "neo4j"
  
  # Kubernetes settings
  NAMESPACE: ""  # Empty string means watch all namespaces
  RESYNC_PERIOD: "30s"
  
  # Logging
  LOG_LEVEL: "info"
  
  # Feature flags
  ENABLE_METRICS: "false"
  ENABLE_LOGS: "false"
  ENABLE_TRACES: "true"

  MCP_PORT: "8081"

  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
  
  # Jaeger tracing configuration
  JAEGER_QUERY_URL: "http://jaeger-query.observability.svc.cluster.local:16686"
  JAEGER_POLL_INTERVAL: "30s"
  JAEGER_LOOKBACK_WINDOW: "5m"
  JAEGER_SPAN_RETENTION: "1h"
  
  # Agent session retention (how long completed sessions remain visible in UI)
  COMPLETED_SESSION_RETENTION_MINUTES: "1440"  # 24 hours
  
  # Agent configuration
  AGENT_ENABLED: "true"
  AGENT_PORT: "8082"
  AGENT_WORKERS: "1"
  AGENT_MCP_SERVER_URL: "http://localhost:8081/mcp"  # Overridden in deployment for pod-local access
  
  # LLM configuration (Gemini)
  LLM_PROVIDER: "gemini"
  LLM_MODEL: "gemini-2.5-flash"
  LLM_TEMPERATURE: "0.2"
  LLM_MAX_TOKENS: "2048"
  LLM_MAX_ITERATIONS: "30"  # Maximum agent loop iterations per investigation
  
  # LLM rate limiting - prevent hitting API quota limits
  # Gemini free tier: 10 requests per minute
  # Using 0.15 RPS = 9 req/min for safety margin
  LLM_RATE_LIMIT_RPS: "0.15"     # Requests per second (9 per minute)
  LLM_RATE_LIMIT_BURST: "2"      # Allow up to 2 burst requests
  
  # Event filtering - configure which K8s event reasons to process
  # Empty means process all events that pass severity filter
  EVENT_FILTER_ALLOWLIST: ""
  EVENT_FILTER_DENYLIST: ""
  
  # Event source configuration - enable/disable individual event sources
  K8S_EVENTS_ENABLED: "false"                # Watch Kubernetes events from API
  ALERTMANAGER_WEBHOOK_ENABLED: "true"      # Receive Prometheus Alertmanager webhooks
  CUSTOM_WEBHOOK_ENABLED: "true"            # Receive custom webhook events

