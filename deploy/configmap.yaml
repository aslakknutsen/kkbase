---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kkbase-watcher-config
data:
  # Neo4j connection settings
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_DATABASE: "neo4j"
  
  # Kubernetes settings
  NAMESPACE: ""  # Empty string means watch all namespaces
  RESYNC_PERIOD: "30s"
  
  # Logging
  LOG_LEVEL: "info"
  
  # Feature flags
  ENABLE_METRICS: "false"
  ENABLE_LOGS: "false"
  ENABLE_TRACES: "true"

  MCP_PORT: "8081"

  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
  
  # Jaeger tracing configuration
  JAEGER_QUERY_URL: "http://jaeger-query.observability.svc.cluster.local:16686"
  JAEGER_POLL_INTERVAL: "30s"
  JAEGER_LOOKBACK_WINDOW: "5m"
  JAEGER_SPAN_RETENTION: "1h"
  
  # Agent session retention (how long completed sessions remain visible in UI)
  COMPLETED_SESSION_RETENTION_MINUTES: "1440"  # 24 hours
  
  # Agent configuration
  AGENT_ENABLED: "true"
  AGENT_PORT: "8082"
  AGENT_WORKERS: "1"
  AGENT_MCP_SERVER_URL: "http://localhost:8081/mcp"  # Overridden in deployment for pod-local access
  
  # LLM configuration (Gemini)
  LLM_PROVIDER: "gemini"
  LLM_MODEL: "gemini-2.0-flash-exp"
  LLM_TEMPERATURE: "0.2"
  LLM_MAX_TOKENS: "2048"
  
  # Event filtering - configure which K8s event reasons to process
  # Empty means process all events that pass severity filter
  EVENT_FILTER_ALLOWLIST: ""
  EVENT_FILTER_DENYLIST: ""

