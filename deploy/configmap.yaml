---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kkbase-watcher-config
  namespace: default
data:
  # Neo4j connection settings
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_DATABASE: "neo4j"
  
  # Kubernetes settings
  NAMESPACE: ""  # Empty string means watch all namespaces
  RESYNC_PERIOD: "30s"
  
  # Logging
  LOG_LEVEL: "info"
  
  # Feature flags
  ENABLE_METRICS: "false"
  ENABLE_LOGS: "false"
  ENABLE_TRACES: "false"

