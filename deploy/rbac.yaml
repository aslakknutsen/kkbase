---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kkbase-watcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kkbase-watcher
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - configmaps
      - secrets
      - events
    verbs: ["get", "list", "watch"]
  
  # Apps resources
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  
  # Storage resources
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  
  # CustomResourceDefinitions (for CRD discovery)
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  
  # Gateway API resources (v1)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - grpcroutes
    verbs: ["get", "list", "watch"]
  
  # Gateway API resources (v1alpha2)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - tcproutes
      - udproutes
      - tlsroutes
    verbs: ["get", "list", "watch"]
  
  # Gateway API resources (v1beta1)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - referencegrants
    verbs: ["get", "list", "watch"]
  
  # Istio networking resources
  - apiGroups: ["networking.istio.io"]
    resources:
      - gateways
      - virtualservices
      - destinationrules
      - serviceentries
      - sidecars
    verbs: ["get", "list", "watch"]
  
  # Istio security resources
  - apiGroups: ["security.istio.io"]
    resources:
      - authorizationpolicies
      - peerauthentications
      - requestauthentications
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kkbase-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kkbase-watcher
subjects:
  - kind: ServiceAccount
    name: kkbase-watcher
    namespace: default

