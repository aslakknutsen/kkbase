---
# Watcher Deployment with Integrated MCP Server
# Use this for integrated mode (watcher + MCP in one pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kkbase-watcher
  labels:
    app: kkbase-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kkbase-watcher
  template:
    metadata:
      labels:
        app: kkbase-watcher
    spec:
      serviceAccountName: kkbase-watcher
      containers:
        - name: watcher
          image: quay.io/aslakknutsen/kkbase-watcher:latest
          imagePullPolicy: Always
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kkbase-watcher-config
            - secretRef:
                name: kkbase-watcher-secret
          env:
            # Enable MCP server in integrated mode
            - name: MCP_ENABLED
              value: "true"
            - name: MCP_PORT
              value: "8081"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

