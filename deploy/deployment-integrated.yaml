---
# Integrated Deployment: Watcher + MCP Server + Agent in one pod (3 containers)
# Recommended deployment for production
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kkbase-integrated
  labels:
    app: kkbase-integrated
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kkbase-integrated
  template:
    metadata:
      labels:
        app: kkbase-integrated
    spec:
      serviceAccountName: kkbase-watcher
      
      # Container 1: Watcher (K8s resource watching)
      containers:
        - name: watcher
          image: quay.io/aslakknutsen/kkbase-watcher:latest
          imagePullPolicy: Always
          # No ports - watcher has no HTTP server
          envFrom:
            - configMapRef:
                name: kkbase-watcher-config
            - secretRef:
                name: kkbase-watcher-secret
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        
        # Container 2: MCP Server (HTTP + Frontend + Agent Tools)
        - name: mcp-server
          image: quay.io/aslakknutsen/kkbase-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - name: http-mcp
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kkbase-watcher-config
            - secretRef:
                name: kkbase-watcher-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
        
        # Container 3: Agent (Autonomous Investigation with Gemini LLM)
        - name: agent
          image: quay.io/aslakknutsen/kkbase-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http-agent
              containerPort: 8082
              protocol: TCP
          env:
            # Agent connects to MCP server on localhost since they're in the same pod
            - name: AGENT_MCP_SERVER_URL
              value: "http://localhost:8081/mcp"
          envFrom:
            - configMapRef:
                name: kkbase-watcher-config
            - secretRef:
                name: kkbase-watcher-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 5

