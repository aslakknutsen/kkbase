---
# Service for Integrated Deployment (Watcher + MCP Server + Agent in one pod)
# Exposes MCP server port (8081) and Agent port (8082)
apiVersion: v1
kind: Service
metadata:
  name: kkbase-integrated
  labels:
    app: kkbase-integrated
spec:
  type: ClusterIP
  selector:
    app: kkbase-integrated
  # Session affinity for SSE connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour for long-lived SSE connections
  ports:
    - name: http-mcp
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: http-agent
      port: 8082
      targetPort: 8082
      protocol: TCP

