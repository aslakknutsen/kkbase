---
# Service for Integrated Mode (Watcher + MCP)
# Use this when deploying with deployment-integrated.yaml
apiVersion: v1
kind: Service
metadata:
  name: kkbase-watcher
  labels:
    app: kkbase-watcher
spec:
  selector:
    app: kkbase-watcher
  ports:
    - name: health
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: mcp
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP

