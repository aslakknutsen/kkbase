---
# Service for Integrated Deployment (Watcher + MCP Server in one pod)
# Exposes only the MCP server port
apiVersion: v1
kind: Service
metadata:
  name: kkbase-integrated
  labels:
    app: kkbase-integrated
spec:
  type: ClusterIP
  selector:
    app: kkbase-integrated
  # Session affinity for SSE connections
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600  # 1 hour for long-lived SSE connections
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP

