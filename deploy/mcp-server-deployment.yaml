---
# Standalone MCP Server Deployment
# Deploy this for standalone mode (separate from watcher)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kkbase-mcp-server
  labels:
    app: kkbase-mcp-server
spec:
  replicas: 2  # Can scale independently from watcher
  selector:
    matchLabels:
      app: kkbase-mcp-server
  template:
    metadata:
      labels:
        app: kkbase-mcp-server
    spec:
      containers:
        - name: mcp-server
          image: quay.io/aslakknutsen/kkbase-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          env:
            - name: NEO4J_URI
              valueFrom:
                configMapKeyRef:
                  name: kkbase-watcher-config
                  key: NEO4J_URI
            - name: NEO4J_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: kkbase-watcher-config
                  key: NEO4J_USERNAME
            - name: NEO4J_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: kkbase-watcher-config
                  key: NEO4J_DATABASE
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kkbase-watcher-secret
                  key: NEO4J_PASSWORD
            - name: MCP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

